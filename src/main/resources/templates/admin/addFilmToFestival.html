<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aggiungi Film al Festival - Pannello Admin</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Barra di Navigazione -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
        <div class="container">
            <a class="navbar-brand" href="/">Gestione Festival</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="/festival">Elenco Festival</a></li>
                    <li class="nav-item"><a class="nav-link" href="/film">Elenco Film</a></li>
                    <li class="nav-item"><a class="nav-link" href="/regista">Elenco Registi</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <span class="text-light me-3">Admin: <strong sec:authentication="name">Utente</strong></span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-danger btn-sm">Esci</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenuto Principale: Form centrato -->
    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <div class="card shadow-sm border-0">

                    <!-- Intestazione -->
                    <div class="card-header bg-primary text-white pt-4 pb-3 border-0">
                        <h4 class="mb-0 text-center fw-bold">🎬 Associa Film al Festival</h4>
                    </div>

                    <div class="card-body p-4 p-md-5">

                        <p class="text-muted text-center mb-4">Stai aggiungendo un film al palinsesto per: <strong
                                class="text-dark" th:text="${festival.nome}">Festival</strong></p>

                        <!-- FORM -->
                        <form th:action="@{'/admin/festival/' + ${festival.id} + '/aggiungiFilm'}" method="post">

                            <!-- Selezione Film -->
                            <div class="mb-5">
                                <label for="filmId" class="form-label fw-bold text-secondary">Seleziona un Film dal
                                    database</label>
                                <select id="filmId" name="filmId" class="form-select form-select-lg" required>
                                    <option value="" disabled selected>-- Scegli un film --</option>
                                    <option th:each="film : ${elencoFilm}" th:value="${film.id}"
                                        th:text="${film.titolo} + ' (' + ${film.anno} + ')'"></option>
                                </select>
                            </div>

                            <!-- Bottoni d'Azione -->
                            <div class="d-grid gap-3">
                                <button type="submit" class="btn btn-primary btn-lg fw-bold">➕ Aggiungi al
                                    Programma</button>
                                <a th:href="@{'/festival/' + ${festival.id}}" class="btn btn-outline-secondary">❌
                                    Annulla e torna al Festival</a>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
