<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Programma Proiezione - Pannello Admin</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Barra di Navigazione -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
        <div class="container">
            <a class="navbar-brand" href="/">Gestione Festival</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="/festival">Elenco Festival</a></li>
                    <li class="nav-item"><a class="nav-link" href="/film">Elenco Film</a></li>
                    <li class="nav-item"><a class="nav-link" href="/regista">Elenco Registi</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <span class="text-light me-3">Admin: <strong sec:authentication="name">Utente</strong></span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-danger btn-sm">Esci</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenuto Principale: Form centrato -->
    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">

                <div class="card shadow-sm border-0">

                    <!-- Intestazione del Form -->
                    <div class="card-header bg-danger text-white pt-4 pb-3 border-0">
                        <h4 class="mb-0 text-center fw-bold">🎬 Programma una Proiezione</h4>
                    </div>

                    <div class="card-body p-4 p-md-5">

                        <!-- FORM -->
                        <form th:action="@{/admin/proiezione/nuova}" th:object="${proiezione}" method="post">

                            <!-- Selezione Festival -->
                            <div class="mb-4">
                                <label for="festival" class="form-label fw-bold text-secondary">Festival</label>
                                <select id="festival" th:field="*{festival}" class="form-select form-select-lg"
                                    required>
                                    <option value="">-- Seleziona un Festival --</option>
                                    <option th:each="f : ${festivals}" th:value="${f.id}"
                                        th:text="${f.nome} + ' (' + ${f.anno} + ')'"></option>
                                </select>
                            </div>

                            <!-- Selezione Film -->
                            <div class="mb-4">
                                <label for="film" class="form-label fw-bold text-secondary">Film da proiettare</label>
                                <select id="film" th:field="*{film}" class="form-select form-select-lg" required>
                                    <option value="">-- Seleziona un Film --</option>
                                    <option th:each="film : ${films}" th:value="${film.id}" th:text="${film.titolo}">
                                    </option>
                                </select>
                            </div>

                            <!-- Selezione Sala -->
                            <div class="mb-4">
                                <label for="sala" class="form-label fw-bold text-secondary">Sala</label>
                                <select id="sala" th:field="*{sala}" class="form-select form-select-lg" required>
                                    <option value="">-- Seleziona una Sala --</option>
                                    <option th:each="s : ${sale}" th:value="${s.id}"
                                        th:text="${s.nome} + ' (Capienza: ' + ${s.capienza} + ')'"></option>
                                </select>
                            </div>

                            <!-- Data e Ora affiancate -->
                            <div class="row mb-5">
                                <div class="col-md-6 mb-4 mb-md-0">
                                    <label for="data" class="form-label fw-bold text-secondary">Data della
                                        Proiezione</label>
                                    <input type="date" id="data" class="form-control form-control-lg text-muted"
                                        th:field="*{data}" required>
                                    <div th:if="${#fields.hasErrors('data')}" th:errors="*{data}"
                                        class="text-danger small mt-2 fw-semibold">Errore data</div>
                                </div>

                                <div class="col-md-6">
                                    <label for="ora" class="form-label fw-bold text-secondary">Ora di Inizio</label>
                                    <input type="time" id="ora" class="form-control form-control-lg text-muted"
                                        th:field="*{ora}" required>
                                    <div th:if="${#fields.hasErrors('ora')}" th:errors="*{ora}"
                                        class="text-danger small mt-2 fw-semibold">Errore ora</div>
                                </div>
                            </div>

                            <!-- Bottoni d'Azione -->
                            <div class="d-grid gap-3">
                                <button type="submit" class="btn btn-danger btn-lg fw-bold">🎬 Conferma
                                    Programmazione</button>
                                <a href="/" class="btn btn-outline-secondary">Annulla e Torna alla Home</a>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
