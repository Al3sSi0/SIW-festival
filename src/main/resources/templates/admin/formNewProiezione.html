<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Programma Proiezione - Pannello Admin</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Barra di Navigazione -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
        <div class="container">
            <a class="navbar-brand" href="/">Gestione Festival</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="/festival">Elenco Festival</a></li>
                    <li class="nav-item"><a class="nav-link" href="/film">Elenco Film</a></li>
                    <li class="nav-item"><a class="nav-link" href="/regista">Elenco Registi</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <span class="text-light me-3">Admin: <strong sec:authentication="name">Utente</strong></span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-danger btn-sm">Esci</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenuto Principale: Form centrato -->
    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">

                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white pt-4 pb-3 border-0">
                        <h4 class="mb-0 text-center fw-bold">📅 Programma una Proiezione</h4>
                    </div>

                    <div class="card-body p-4 p-md-5">

                        <!-- FORM -->
                        <form th:action="@{/admin/proiezione/nuova}" th:object="${proiezione}" method="post">

                            <!-- Selezione Festival -->
                            <div class="mb-4">
                                <label for="festival" class="form-label fw-bold text-secondary">Festival</label>
                                <select id="festival" th:field="*{festival}" class="form-select form-select-lg" required>
                                    <option value="">-- Seleziona un Festival --</option>
                                    <option th:each="f : ${festivals}" th:value="${f.id}"
                                        th:text="${f.nome} + ' (' + ${f.anno} + ')'"></option>
                                </select>
                                <div th:if="${#fields.hasErrors('festival')}" th:errors="*{festival}" class="text-danger small mt-2 fw-semibold">Errore festival</div>
                            </div>

                            <!-- 🛠️ MAGAZZINO NASCOSTO: Contiene tutti i film taggati col loro festival -->
                            <div id="magazzino-film" style="display: none;">
                                <th:block th:each="f : ${festivals}">
                                    <option th:each="film : ${f.filmPartecipanti}" 
                                            th:value="${film.id}" 
                                            th:text="${film.titolo}"
                                            th:attr="data-festival-id=${f.id}">
                                    </option>
                                </th:block>
                            </div>

                            <!-- Selezione Film (Dinamicamente popolata da JS) -->
                            <div class="mb-4">
                                <label for="film" class="form-label fw-bold text-secondary">Film da proiettare</label>
                                <!-- Parte bloccato e vuoto (disabled). Ci pensa JS a sbloccarlo -->
                                <select id="film" th:field="*{film}" class="form-select form-select-lg" required disabled>
                                    <option value="">-- Prima seleziona un Festival --</option>
                                </select>
                                <div th:if="${#fields.hasErrors('film')}" th:errors="*{film}" class="text-danger small mt-2 fw-semibold">Errore film</div>
                            </div>

                            <!-- Selezione Sala -->
                            <div class="mb-4">
                                <label for="sala" class="form-label fw-bold text-secondary">Sala</label>
                                <select id="sala" th:field="*{sala}" class="form-select form-select-lg" required>
                                    <option value="">-- Seleziona una Sala --</option>
                                    <option th:each="s : ${sale}" th:value="${s.id}"
                                        th:text="${s.nome} + ' (Capienza: ' + ${s.capienza} + ')'"></option>
                                </select>
                                <div th:if="${#fields.hasErrors('sala')}" th:errors="*{sala}" class="text-danger small mt-2 fw-semibold">Errore sala</div>
                            </div>

                            <!-- Data e Ora -->
                            <div class="row mb-5">
                                <div class="col-md-6 mb-4 mb-md-0">
                                    <label for="data" class="form-label fw-bold text-secondary">Data</label>
                                    <input type="date" id="data" class="form-control form-control-lg text-muted" th:field="*{data}" required>
                                </div>
                            <div class="col-md-6">
                                <label for="ora" class="form-label fw-bold text-secondary">Ora</label>
                                <input type="time" id="ora" class="form-control form-control-lg text-muted" th:field="*{ora}" required>
                                
                                <!-- ✨ AGGIUNGI QUESTA RIGA: Mostra l'errore intercettato dal tuo Controller! ✨ -->
                                <div th:if="${#fields.hasErrors('ora')}" th:errors="*{ora}" class="text-danger small mt-2 fw-semibold">
                                    Errore, Sala occupata in questo orario.
                                </div>
                            </div>
                            </div>

                            <!-- Bottoni -->
                            <div class="d-grid gap-3">
                                <button type="submit" class="btn btn-primary btn-lg fw-bold">✅ Conferma Programmazione</button>
                                <a href="/festival" class="btn btn-outline-secondary">❌ Annulla e torna ai Festival</a>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 🪄 SCRIPT MAGICO PER FILTRARE I FILM -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const festivalSelect = document.getElementById("festival");
            const filmSelect = document.getElementById("film");
            const magazzinoFilm = document.getElementById("magazzino-film").children;

            // Conserviamo in memoria l'ID del film se stiamo ricaricando la pagina (es. per un errore)
            const filmPreselezionato = filmSelect.getAttribute("value"); 

            function aggiornaFilm() {
                const idFestival = festivalSelect.value;
                
                // 1. Pulizia: resettiamo il menù Film lasciando solo la voce di default
                filmSelect.innerHTML = '<option value="">-- Seleziona un Film --</option>';

                // 2. Controllo: se non hai scelto un festival, il campo film resta disabilitato
                if (!idFestival) {
                    filmSelect.disabled = true;
                    return;
                }

                // 3. Azione: hai scelto un festival! Sblocchiamo il menù
                filmSelect.disabled = false;

                // 4. Filtro: peschiamo dal magazzino solo i film che hanno data-festival-id uguale al festival scelto
                Array.from(magazzinoFilm).forEach(opt => {
                    if (opt.getAttribute("data-festival-id") === idFestival) {
                        const nuovaOpzione = opt.cloneNode(true);
                        
                        // Se c'era un errore e il form si ricarica, prova a riselezionare il film che avevi cliccato
                        if (filmPreselezionato && nuovaOpzione.value === filmPreselezionato) {
                            nuovaOpzione.selected = true;
                        }
                        
                        filmSelect.appendChild(nuovaOpzione);
                    }
                });
            }

            // Ascolta quando l'utente cambia festival e avvia la funzione
            festivalSelect.addEventListener("change", aggiornaFilm);

            // Avviamo la funzione anche appena la pagina si apre 
            // (fondamentale se stai modificando o se c'è stato un errore nel form)
            aggiornaFilm();
        });
    </script>
</body>

</html>
