<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modifica Proiezione - Pannello Admin</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Barra di Navigazione -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
        <div class="container">
            <a class="navbar-brand" href="/">Gestione Festival</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="/festival">Elenco Festival</a></li>
                    <li class="nav-item"><a class="nav-link" href="/film">Elenco Film</a></li>
                    <li class="nav-item"><a class="nav-link" href="/regista">Elenco Registi</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <span class="text-light me-3">Admin: <strong sec:authentication="name">Utente</strong></span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-danger btn-sm">Esci</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenuto Principale: Form centrato -->
    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <div class="card shadow-sm border-0">

                    <!-- Intestazione (Gialla per Modifica) -->
                    <div class="card-header bg-warning text-dark pt-4 pb-3 border-0">
                        <h4 class="mb-0 text-center fw-bold">✏️ Modifica Proiezione</h4>
                    </div>

                    <div class="card-body p-4 p-md-5">

                        <!-- FORM -->
                        <form th:action="@{'/admin/proiezione/modifica/' + ${festivalId} + '/' + ${proiezione.id}}"
                            th:object="${proiezione}" method="post">

                            <!-- ID Nascosto Fondamentale per l'aggiornamento -->
                            <input type="hidden" th:field="*{id}">

                            <div class="row mb-4">
                                <!-- Data -->
                                <div class="col-md-6 mb-4 mb-md-0">
                                    <label for="data" class="form-label fw-bold text-secondary">Data</label>
                                    <input type="date" id="data" class="form-control form-control-lg text-muted"
                                        th:field="*{data}" required>
                                    <!-- ✨ ERRORE DATA -->
                                    <div th:if="${#fields.hasErrors('data')}" th:errors="*{data}" class="text-danger small mt-2 fw-semibold">Errore data</div>
                                </div>

                                <!-- Ora -->
                                <div class="col-md-6">
                                    <label for="ora" class="form-label fw-bold text-secondary">Ora (HH:mm)</label>
                                    <input type="time" id="ora" class="form-control form-control-lg text-muted"
                                        th:field="*{ora}" required>
                                    <!-- ✨ ERRORE ORA (Sovrapposizione) -->
                                    <div th:if="${#fields.hasErrors('ora')}" th:errors="*{ora}" class="text-danger small mt-2 fw-semibold">Errore orario</div>
                                </div>
                            </div>

                            <!-- Stato della Proiezione -->
                            <div class="mb-5">
                                <label for="stato" class="form-label fw-bold text-secondary">Stato della
                                    Proiezione</label>
                                <select id="stato" class="form-select form-select-lg" th:field="*{stato}" required>
                                    <option value="SCHEDULED">Programmata</option>
                                    <option value="COMPLETED">Completata</option>
                                    <option value="CANCELLED">Annullata</option>
                                </select>
                                <!-- ✨ ERRORE STATO -->
                                <div th:if="${#fields.hasErrors('stato')}" th:errors="*{stato}" class="text-danger small mt-2 fw-semibold">Errore stato</div>
                            </div>

                            <!-- Bottoni d'Azione -->
                            <div class="d-grid gap-3">
                                <button type="submit" class="btn btn-warning btn-lg fw-bold">💾 Salva Modifiche</button>
                                <a th:href="@{'/festival/' + ${festivalId}}" class="btn btn-outline-secondary">❌ Annulla
                                    e torna al Festival</a>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
