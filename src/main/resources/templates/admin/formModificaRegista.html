<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modifica Regista - Pannello Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Barra di Navigazione -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
        <div class="container">
            <a class="navbar-brand" href="/">Gestione Festival</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="/festival">Elenco Festival</a></li>
                    <li class="nav-item"><a class="nav-link" href="/film">Elenco Film</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="/regista">Elenco
                            Registi</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <span class="text-light me-3">Admin: <strong sec:authentication="name">Utente</strong></span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-danger btn-sm">Esci</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenuto Principale: Form centrato -->
    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <div class="card shadow-sm border-0">

                    <!-- Intestazione (Gialla per Modifica) -->
                    <div class="card-header bg-warning text-dark pt-4 pb-3 border-0">
                        <h4 class="mb-0 text-center fw-bold">✏️ Modifica Regista</h4>
                    </div>

                    <div class="card-body p-4 p-md-5">

                        <!-- FORM -->
                        <form th:action="@{'/admin/regista/modifica/' + ${regista.id}}" th:object="${regista}"
                            method="post">

                            <!-- ID Nascosto Fondamentale -->
                            <input type="hidden" th:field="*{id}">

                            <div class="row">
                                <!-- Nome -->
                                <div class="col-md-6 mb-4">
                                    <label for="nome" class="form-label fw-bold text-secondary">Nome</label>
                                    <input type="text" id="nome" class="form-control form-control-lg" th:field="*{nome}"
                                        required>
                                </div>

                                <!-- Cognome -->
                                <div class="col-md-6 mb-4">
                                    <label for="cognome" class="form-label fw-bold text-secondary">Cognome</label>
                                    <input type="text" id="cognome" class="form-control form-control-lg"
                                        th:field="*{cognome}" required>
                                </div>
                            </div>

                            <!-- Data di Nascita -->
                            <div class="mb-4">
                                <label for="dataNascita" class="form-label fw-bold text-secondary">Data di
                                    Nascita</label>
                                <input type="date" id="dataNascita" class="form-control form-control-lg text-muted"
                                    th:field="*{dataNascita}" required>
                            </div>

                            <!-- Nazionalità -->
                            <div class="mb-5">
                                <label for="nazionalita" class="form-label fw-bold text-secondary">Nazionalità</label>
                                <input type="text" id="nazionalita" class="form-control form-control-lg"
                                    th:field="*{nazionalita}">
                            </div>

                            <!-- Bottoni d'Azione -->
                            <div class="d-grid gap-3">
                                <button type="submit" class="btn btn-warning btn-lg fw-bold">💾 Salva Modifiche</button>
                                <a th:href="@{'/regista/' + ${regista.id}}" class="btn btn-outline-secondary">❌ Annulla
                                    e torna al Regista</a>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
