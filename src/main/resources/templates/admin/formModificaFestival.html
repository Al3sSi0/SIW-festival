<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modifica Festival - Pannello Admin</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Barra di Navigazione -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
        <div class="container">
            <a class="navbar-brand" href="/">Gestione Festival</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="/festival">Elenco
                            Festival</a></li>
                    <li class="nav-item"><a class="nav-link" href="/film">Elenco Film</a></li>
                    <li class="nav-item"><a class="nav-link" href="/regista">Elenco Registi</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <span class="text-light me-3">Admin: <strong sec:authentication="name">Utente</strong></span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-danger btn-sm">Esci</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenuto Principale: Form centrato -->
    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">

                <div class="card shadow-sm border-0">

                    <!-- Intestazione (Gialla per Modifica) -->
                    <div class="card-header bg-warning text-dark pt-4 pb-3 border-0">
                        <h4 class="mb-0 text-center fw-bold">✏️ Modifica Festival</h4>
                    </div>

                    <div class="card-body p-4 p-md-5">

                        <!-- FORM -->
                        <form th:action="@{'/admin/festival/modifica/' + ${festival.id}}" th:object="${festival}"
                            method="post">

                            <!-- ID Nascosto (FONDAMENTALE) -->
                            <input type="hidden" th:field="*{id}">

                            <!-- Nome Festival -->
                            <div class="mb-4">
                                <label for="nome" class="form-label fw-bold text-secondary">Nome del Festival</label>
                                <input type="text" id="nome" class="form-control form-control-lg" th:field="*{nome}"
                                    required>
                                <div th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"
                                    class="text-danger small mt-2 fw-semibold">Errore</div>
                            </div>

                            <!-- Anno e Città affiancati -->
                            <div class="row mb-4">
                                <div class="col-md-6 mb-4 mb-md-0">
                                    <label for="anno" class="form-label fw-bold text-secondary">Edizione (Anno)</label>
                                    <input type="number" id="anno" class="form-control form-control-lg"
                                        th:field="*{anno}" required>
                                    <div th:if="${#fields.hasErrors('anno')}" th:errors="*{anno}"
                                        class="text-danger small mt-2 fw-semibold">Errore</div>
                                </div>
                                <div class="col-md-6">
                                    <label for="citta" class="form-label fw-bold text-secondary">Città</label>
                                    <input type="text" id="citta" class="form-control form-control-lg"
                                        th:field="*{citta}" required>
                                    <div th:if="${#fields.hasErrors('citta')}" th:errors="*{citta}"
                                        class="text-danger small mt-2 fw-semibold">Errore</div>
                                </div>
                            </div>

                            <!-- Date di Inizio e Fine affiancate -->
                            <div class="row mb-4">
                                <div class="col-md-6 mb-4 mb-md-0">
                                    <label for="dataInizio" class="form-label fw-bold text-secondary">Data
                                        Inizio</label>
                                    <input type="date" id="dataInizio" class="form-control form-control-lg text-muted"
                                        th:field="*{dataInizio}">
                                </div>
                                <div class="col-md-6">
                                    <label for="dataFine" class="form-label fw-bold text-secondary">Data Fine</label>
                                    <input type="date" id="dataFine" class="form-control form-control-lg text-muted"
                                        th:field="*{dataFine}">
                                </div>
                            </div>

                            <!-- Descrizione (Textarea) -->
                            <div class="mb-5">
                                <label for="descrizione" class="form-label fw-bold text-secondary">Descrizione</label>
                                <textarea id="descrizione" class="form-control form-control-lg"
                                    th:field="*{descrizione}" rows="4"
                                    placeholder="Inserisci i dettagli del festival..."></textarea>
                            </div>

                            <!-- Bottoni d'Azione -->
                            <div class="d-grid gap-3">
                                <button type="submit" class="btn btn-warning btn-lg fw-bold">💾 Salva Modifiche</button>
                                <!-- Tasto Annulla dinamico: riporta alla pagina di dettaglio del festival -->
                                <a th:href="@{'/festival/' + ${festival.id}}" class="btn btn-outline-secondary">❌
                                    Annulla e torna al Festival</a>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
