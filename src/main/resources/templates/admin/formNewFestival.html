<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Aggiungi Nuovo Festival</title>
</head>

<body>
    <h1>Inserisci un Nuovo Festival</h1>

    <form th:action="@{/admin/festival/nuovo}" th:object="${festival}" method="post">

        <div>
            <label>Nome:</label>
            <input type="text" th:field="*{nome}">
            <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" style="color: red;">Errore</span>
        </div>
        <br>
        <div>
            <label>Anno:</label>
            <input type="number" th:field="*{anno}">
            <span th:if="${#fields.hasErrors('anno')}" th:errors="*{anno}" style="color: red;">Errore</span>
        </div>
        <br>
        <div>
            <label>Città:</label>
            <input type="text" th:field="*{citta}">
            <span th:if="${#fields.hasErrors('citta')}" th:errors="*{citta}" style="color: red;">Errore</span>
        </div>
        <!DOCTYPE html>
        <html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Nuovo Festival - Pannello Admin</title>
            <!-- Bootstrap 5 CSS -->
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        </head>

        <body class="bg-light">

            <!-- Barra di Navigazione -->
            <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
                <div class="container">
                    <a class="navbar-brand" href="/">Gestione Festival</a>
                    <div class="collapse navbar-collapse">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                            <li class="nav-item"><a class="nav-link" href="/festival">Elenco Festival</a></li>
                            <li class="nav-item"><a class="nav-link" href="/film">Elenco Film</a></li>
                            <li class="nav-item"><a class="nav-link" href="/regista">Elenco Registi</a></li>
                        </ul>
                        <div class="d-flex align-items-center">
                            <span class="text-light me-3">Admin: <strong
                                    sec:authentication="name">Utente</strong></span>
                            <form th:action="@{/logout}" method="post" class="m-0">
                                <button type="submit" class="btn btn-danger btn-sm">Esci</button>
                            </form>
                        </div>
                    </div>
                </div>
            </nav>

            <!-- Contenuto Principale -->
            <div class="container mb-5">
                <div class="row justify-content-center">
                    <div class="col-md-8 col-lg-6">

                        <div class="card shadow-sm border-0">

                            <!-- Intestazione -->
                            <div class="card-header bg-primary text-white pt-4 pb-3 border-0">
                                <h4 class="mb-0 text-center fw-bold">🏆 Inserisci Nuovo Festival</h4>
                            </div>

                            <div class="card-body p-4 p-md-5">

                                <!-- FORM -->
                                <form th:action="@{/admin/festival/nuovo}" th:object="${festival}" method="post">

                                    <!-- Nome -->
                                    <div class="mb-4">
                                        <label for="nome" class="form-label fw-bold text-secondary">Nome del
                                            Festival</label>
                                        <input type="text" id="nome" class="form-control form-control-lg"
                                            th:field="*{nome}" placeholder="Es. Festival di Cannes" required>
                                        <div th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"
                                            class="text-danger small mt-2 fw-semibold">Errore nome</div>
                                    </div>

                                    <div class="row">
                                        <!-- Anno -->
                                        <div class="col-md-6 mb-4">
                                            <label for="anno" class="form-label fw-bold text-secondary">Edizione
                                                (Anno)</label>
                                            <input type="number" id="anno" class="form-control form-control-lg"
                                                th:field="*{anno}" placeholder="Es. 2026" required>
                                            <div th:if="${#fields.hasErrors('anno')}" th:errors="*{anno}"
                                                class="text-danger small mt-2 fw-semibold">Errore anno</div>
                                        </div>

                                        <!-- Città -->
                                        <div class="col-md-6 mb-5">
                                            <label for="citta" class="form-label fw-bold text-secondary">Città
                                                Ospitante</label>
                                            <input type="text" id="citta" class="form-control form-control-lg"
                                                th:field="*{citta}" placeholder="Es. Roma" required>
                                            <div th:if="${#fields.hasErrors('citta')}" th:errors="*{citta}"
                                                class="text-danger small mt-2 fw-semibold">Errore città</div>
                                        </div>
                                    </div>

                                    <!-- Bottoni d'Azione -->
                                    <div class="d-grid gap-3">
                                        <button type="submit" class="btn btn-primary btn-lg fw-bold">💾 Salva
                                            Festival</button>
                                        <a href="/" class="btn btn-outline-secondary">Annulla e Torna alla Home</a>
                                    </div>

                                </form>

                            </div>
                        </div>

                    </div>
                </div>
            </div>

            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        </body>

        </html>
        <br>

        <button type="submit">Salva Festival</button>
    </form>

    <br>
    <a href="/">Torna alla Home</a>
</body>

</html>
