<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modifica Sala - Pannello Admin</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Barra di Navigazione -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
        <div class="container">
            <a class="navbar-brand" href="/">Gestione Festival</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="/festival">Elenco Festival</a></li>
                    <li class="nav-item"><a class="nav-link" href="/film">Elenco Film</a></li>
                    <li class="nav-item"><a class="nav-link" href="/regista">Elenco Registi</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <span class="text-light me-3">Admin: <strong sec:authentication="name">Utente</strong></span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-danger btn-sm">Esci</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenuto Principale: Form centrato -->
    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <div class="card shadow-sm border-0">

                    <!-- Intestazione (Colore Giallo per indicare "Modifica") -->
                    <div class="card-header bg-warning text-dark pt-4 pb-3 border-0">
                        <h4 class="mb-0 text-center fw-bold">✏️ Modifica Sala</h4>
                    </div>

                    <div class="card-body p-4 p-md-5">

                        <!-- FORM -->
                        <form th:action="@{'/admin/sala/modifica/' + ${sala.id}}" th:object="${sala}" method="post">

                            <!-- Campo nascosto FONDAMENTALE per Hibernate (altrimenti crea un duplicato) -->
                            <input type="hidden" th:field="*{id}">

                            <!-- Nome Sala -->
                            <div class="mb-4">
                                <label for="nome" class="form-label fw-bold text-secondary">Nome Sala</label>
                                <input type="text" id="nome" class="form-control form-control-lg" th:field="*{nome}"
                                    required>
                                <div th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"
                                    class="text-danger small mt-2 fw-semibold">Errore nome</div>
                            </div>

                            <!-- Indirizzo -->
                            <div class="mb-4">
                                <label for="indirizzo" class="form-label fw-bold text-secondary">Indirizzo</label>
                                <input type="text" id="indirizzo" class="form-control form-control-lg"
                                    th:field="*{indirizzo}" required>
                                <div th:if="${#fields.hasErrors('indirizzo')}" th:errors="*{indirizzo}"
                                    class="text-danger small mt-2 fw-semibold">Errore indirizzo</div>
                            </div>

                            <!-- Capienza -->
                            <div class="mb-5">
                                <label for="capienza" class="form-label fw-bold text-secondary">Capienza (Posti a
                                    sedere)</label>
                                <input type="number" id="capienza" class="form-control form-control-lg"
                                    th:field="*{capienza}" required>
                                <div th:if="${#fields.hasErrors('capienza')}" th:errors="*{capienza}"
                                    class="text-danger small mt-2 fw-semibold">Errore capienza</div>
                            </div>

                            <!-- Bottoni d'Azione -->
                            <div class="d-grid gap-3">
                                <button type="submit" class="btn btn-warning btn-lg fw-bold">💾 Salva Modifiche</button>
                                <a href="/" class="btn btn-outline-secondary">Annulla e Torna alla Home</a>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
