<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nuovo Film - Pannello Admin</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Barra di Navigazione -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
        <div class="container">
            <a class="navbar-brand" href="/">Gestione Festival</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="/festival">Elenco Festival</a></li>
                    <li class="nav-item"><a class="nav-link" href="/film">Elenco Film</a></li>
                    <li class="nav-item"><a class="nav-link" href="/regista">Elenco Registi</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <span class="text-light me-3">Admin: <strong sec:authentication="name">Utente</strong></span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-danger btn-sm">Esci</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenuto Principale -->
    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">

                <div class="card shadow-sm border-0">

                    <!-- Intestazione -->
                    <div class="card-header bg-success text-white pt-4 pb-3 border-0">
                        <h4 class="mb-0 text-center fw-bold">🎬 Inserisci Nuovo Film</h4>
                    </div>

                    <div class="card-body p-4 p-md-5">

                        <!-- FORM (Senza file upload, super leggero!) -->
                        <form th:action="@{/admin/film/nuovo}" th:object="${film}" method="post">

                            <!-- Titolo -->
                            <div class="mb-4">
                                <label for="titolo" class="form-label fw-bold text-secondary">Titolo del Film</label>
                                <input type="text" id="titolo" class="form-control form-control-lg" th:field="*{titolo}"
                                    placeholder="Es. Inception" required>
                                <div th:if="${#fields.hasErrors('titolo')}" th:errors="*{titolo}"
                                    class="text-danger small mt-2 fw-semibold">Errore</div>
                            </div>

                            <div class="row">
                                <!-- Anno -->
                                <div class="col-md-6 mb-4">
                                    <label for="anno" class="form-label fw-bold text-secondary">Anno d'uscita</label>
                                    <input type="number" id="anno" class="form-control form-control-lg"
                                        th:field="*{anno}" placeholder="Es. 2010" required>
                                    <div th:if="${#fields.hasErrors('anno')}" th:errors="*{anno}"
                                        class="text-danger small mt-2 fw-semibold">Errore</div>
                                </div>

                                <!-- Durata -->
                                <div class="col-md-6 mb-4">
                                    <label for="durata" class="form-label fw-bold text-secondary">Durata (in
                                        minuti)</label>
                                    <input type="number" id="durata" class="form-control form-control-lg"
                                        th:field="*{durata}" placeholder="Es. 148" required>
                                    <div th:if="${#fields.hasErrors('durata')}" th:errors="*{durata}"
                                        class="text-danger small mt-2 fw-semibold">Errore</div>
                                </div>
                            </div>

                            <!-- Genere -->
                            <div class="mb-4">
                                <label for="genere" class="form-label fw-bold text-secondary">Genere</label>
                                <input type="text" id="genere" class="form-control form-control-lg" th:field="*{genere}"
                                    placeholder="Es. Fantascienza" required>
                                <div th:if="${#fields.hasErrors('genere')}" th:errors="*{genere}"
                                    class="text-danger small mt-2 fw-semibold">Errore</div>
                            </div>

                            <!-- Regista -->
                            <div class="mb-4">
                                <label for="regista" class="form-label fw-bold text-secondary">Regista</label>
                                <select id="regista" th:field="*{regista}" class="form-select form-select-lg" required>
                                    <option value="" selected>-- Seleziona un Regista --</option>
                                    <option th:each="r : ${elencoRegisti}" th:value="${r.id}"
                                        th:text="${r.nome} + ' ' + ${r.cognome}"></option>
                                </select>
                                <div th:if="${#fields.hasErrors('regista')}" th:errors="*{regista}"
                                    class="text-danger small mt-2 fw-semibold">Errore</div>
                            </div>

                            <!-- NUOVO CAMPO: Link Immagine (URL) -->
                            <div class="mb-5">
                                <label for="urlImmagine" class="form-label fw-bold text-secondary">Link della Locandina
                                    (URL Immagine)</label>
                                <input type="url" id="urlImmagine" class="form-control form-control-lg text-muted"
                                    th:field="*{urlImmagine}" placeholder="Es. https://sito.com/immagine.jpg">
                                <div class="form-text">Incolla qui l'indirizzo web dell'immagine (opzionale).</div>
                            </div>

                            <!-- Bottoni d'Azione -->
                            <div class="d-grid gap-3">
                                <button type="submit" class="btn btn-success btn-lg fw-bold">💾 Salva Film</button>
                                <a href="/" class="btn btn-outline-secondary">Annulla e Torna alla Home</a>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
