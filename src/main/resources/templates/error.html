<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ops! Qualcosa è andato storto</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">

    <div class="container text-center">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <div class="card shadow border-0 mt-5">
                    <div class="card-header bg-danger text-white pt-4 pb-3 border-0">
                        <h1 class="display-1 fw-bold mb-0">⚠️</h1>
                        <h2 class="fw-bold mt-2">Ops! Si è verificato un errore.</h2>
                    </div>

                    <div class="card-body p-5 bg-white text-dark">
                        <!-- Spring Boot inietta automaticamente le variabili status, error e message -->
                        <h4 class="text-danger fw-bold mb-3">
                            Errore <span th:text="${status}">500</span>: <span th:text="${error}">Internal Server
                                Error</span>
                        </h4>

                        <p class="text-secondary mb-4" style="font-size: 1.1rem;">
                            C'è stato un problema durante l'elaborazione della tua richiesta.
                        </p>

                        <!-- Dettaglio tecnico visibile (opzionale, ma utile per te durante lo sviluppo) -->
                        <div th:if="${message}" class="alert alert-light border text-start text-muted small mb-4"
                            role="alert">
                            <strong>Dettaglio:</strong> <span th:text="${message}">Nessun messaggio disponibile.</span>
                        </div>

                        <div class="d-grid gap-2 col-8 mx-auto mt-4">
                            <a href="/" class="btn btn-outline-danger btn-lg fw-bold">🏠 Torna alla Home</a>
                            <button onclick="history.back()" class="btn btn-link text-secondary text-decoration-none">←
                                Torna alla pagina precedente</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
