<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accedi - Gestione Festival</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center py-5" style="min-height: 100vh;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">

                <!-- Titolo sopra la card -->
                <div class="text-center mb-4">
                    <h2 class="fw-bold">Gestione Festival</h2>
                    <p class="text-muted">Inserisci le tue credenziali per accedere</p>
                </div>

                <div class="card shadow-lg border-0 rounded-lg">
                    <div class="card-body p-5">

                        <!-- Messaggi di Errore o Logout (Gestiti in automatico) -->
                        <div th:if="${param.error}" class="alert alert-danger" role="alert">
                            Username o password non validi. Riprova.
                        </div>
                        <div th:if="${param.logout}" class="alert alert-success" role="alert">
                            Disconnessione effettuata con successo.
                        </div>

                        <!-- Form di Login -->
                        <form th:action="@{/login}" method="post">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="username" name="username"
                                    placeholder="Username" required>
                                <label for="username">Nome Utente</label>
                            </div>
                            <div class="form-floating mb-4">
                                <input type="password" class="form-control" id="password" name="password"
                                    placeholder="Password" required>
                                <label for="password">Password</label>
                            </div>
                            <div class="d-grid gap-2">
                                <button class="btn btn-primary btn-lg" type="submit">Accedi</button>
                            </div>
                        </form>

                    </div>
                    <div class="card-footer text-center py-3 bg-white border-0">
                        <a href="/" class="text-decoration-none text-muted">← Torna alla Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
