<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Elenco Festival - Gestione Festival</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Barra di Navigazione -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
        <div class="container">
            <a class="navbar-brand" href="/">Gestione Festival</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <!-- Questa volta "Elenco Festival" è evidenziato come pagina attiva -->
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="/festival">Elenco
                            Festival</a></li>
                    <li class="nav-item"><a class="nav-link" href="/film">Elenco Film</a></li>
                    <li class="nav-item"><a class="nav-link" href="/regista">Elenco Registi</a></li>
                </ul>
                <div class="d-flex">
                    <div sec:authorize="!isAuthenticated()">
                        <a href="/login" class="btn btn-outline-light">Accedi</a>
                    </div>
                    <div sec:authorize="isAuthenticated()" class="d-flex align-items-center">
                        <span class="text-light me-3">Benvenuto, <strong
                                sec:authentication="name">Utente</strong></span>
                        <form th:action="@{/logout}" method="post" class="m-0">
                            <button type="submit" class="btn btn-danger btn-sm">Esci</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenuto Principale -->
    <div class="container mb-5">

        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
            <h1 class="display-6 fw-bold">I Nostri Festival</h1>
            <a href="/" class="btn btn-outline-secondary btn-sm">← Torna alla Home</a>
        </div>

        <!-- Messaggio se non ci sono festival (Stile Alert) -->
        <div th:if="${elencoFestival.isEmpty()}" class="alert alert-info text-center shadow-sm" role="alert">
            Al momento non ci sono festival in programma. Resta sintonizzato!
        </div>

        <!-- Griglia dei Festival -->
        <div th:unless="${elencoFestival.isEmpty()}" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">

            <div class="col" th:each="festival : ${elencoFestival}">
                <!-- Card del singolo festival -->
                <div class="card h-100 shadow-sm border-0 border-top border-primary border-3">
                    <div class="card-body text-center d-flex flex-column justify-content-center">
                        <h4 class="card-title fw-bold mb-3" th:text="${festival.nome}">Nome Festival</h4>

                        <div class="mb-4">
                            <span class="badge bg-dark mb-2" th:text="'Edizione ' + ${festival.anno}">2026</span>
                            <p class="card-text text-muted mb-0">
                                Sede: <strong th:text="${festival.citta}">Città</strong>
                            </p>
                        </div>

                        <!-- Bottone Dettagli -->
                        <div class="mt-auto">
                            <a th:href="@{'/festival/' + ${festival.id}}"
                                class="btn btn-outline-primary w-100 rounded-pill">Vedi Programma</a>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
